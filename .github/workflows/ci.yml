name: CI

on:
  push:
    branches: [main]
    # Native globs select v-prefixed version-shaped tags, not strict SemVer.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+\+*'
      # Release tags do not use underscores.
      - '!**_*'
  pull_request:
  workflow_dispatch:
    inputs:
      kubernetes:
        description: Run the live Kubernetes acceptance suite (requires KVM)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Generate check matrices
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      quality: ${{ steps.matrix.outputs.quality }}
      docs: ${{ steps.matrix.outputs.docs }}
      native: ${{ steps.matrix.outputs.native }}
      acceptance: ${{ steps.matrix.outputs.acceptance }}
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.release.outputs.published }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      image: ${{ steps.release.outputs.image }}
      image-tag: ${{ steps.release.outputs.image-tag }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - &nix-cache
        name: Cache Nix builds
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        continue-on-error: true
        with:
          version: v3.1.0
          upstream-cache-filter: true
      - id: matrix
        run: |
          matrices=$(nix eval --json --no-update-lock-file path:.#githubActions.matrices)
          for category in quality docs native acceptance; do
            printf '%s=%s\n' "$category" "$(jq -c --arg category "$category" '.[$category]' <<< "$matrices")" >> "$GITHUB_OUTPUT"
          done
      - name: Read release metadata
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: release
        uses: &github-script actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const version = tag.slice(1);
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('version', version);
            core.setOutput('published', Boolean(release && !release.draft));
            core.setOutput('prerelease', version.split('+', 1)[0].includes('-'));
            core.setOutput('image', `ghcr.io/${context.repo.owner}/${context.repo.repo}`.toLowerCase());
            core.setOutput('image-tag', version.replaceAll('+', '_'));

  quality:
    name: Quality checks
    needs: matrix
    runs-on: ${{ fromJSON(needs.matrix.outputs.quality).include[0].os }}
    timeout-minutes: 45
    env:
      NIX_ATTRS: ${{ toJSON(fromJSON(needs.matrix.outputs.quality).include[0].attrs) }}
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - &check
        name: Run checks
        run: |
          mapfile -t attrs < <(jq -r '.[] | "path:.#" + .' <<< "$NIX_ATTRS")
          nix build --no-link --no-update-lock-file --print-build-logs "${attrs[@]}"

  documentation:
    name: Documentation checks
    needs: matrix
    runs-on: ${{ fromJSON(needs.matrix.outputs.docs).include[0].os }}
    timeout-minutes: 30
    env:
      NIX_ATTRS: ${{ toJSON(fromJSON(needs.matrix.outputs.docs).include[0].attrs) }}
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - *check
      - name: Locate documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: site
        run: |
          site=$(nix path-info --no-update-lock-file path:.#checks.x86_64-linux.docs)
          printf 'path=%s\n' "$site" >> "$GITHUB_OUTPUT"
      - name: Upload documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.path }}

  native:
    name: Native checks
    if: github.event_name != 'push' || github.ref_type != 'tag'
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    env:
      NIX_ATTRS: ${{ toJSON(matrix.attrs) }}
    steps:
      - *checkout
      - &release-version
        name: Set release version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ needs.matrix.outputs.version }}
        run: printf '%s\n' "$RELEASE_VERSION" > nix/release-version
      - *nix
      - *nix-cache
      - *check

  release-native:
    name: Native release checks
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [matrix, quality, documentation, acceptance, vulnerabilities]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    env:
      NIX_ATTRS: ${{ toJSON(matrix.attrs) }}
      IMAGE: ${{ needs.matrix.outputs.image }}
      ARCH: ${{ matrix.system == 'x86_64-linux' && 'amd64' || 'arm64' }}
    steps:
      - *checkout
      - *release-version
      - *nix
      - *nix-cache
      - *check
      - name: Locate release archive
        if: needs.matrix.outputs.published != 'true'
        run: nix build --out-link result-release --no-update-lock-file path:.#release-binary
      - name: Upload release artifacts
        if: needs.matrix.outputs.published != 'true'
        uses: &upload-artifact actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.system }}
          path: result-release/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Log in to GHCR
        if: needs.matrix.outputs.published != 'true'
        uses: &registry-login docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: &registry-credentials
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push native container
        if: needs.matrix.outputs.published != 'true'
        run: |
          nix run --no-update-lock-file path:.#container-push -- \
            "$IMAGE:build-$GITHUB_RUN_ID-$ARCH" --digestfile "container-$ARCH.digest"
      - name: Upload container digest
        if: needs.matrix.outputs.published != 'true'
        uses: *upload-artifact
        with:
          name: container-${{ matrix.system }}
          path: container-*.digest
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Stage integration artifacts
        if: needs.matrix.outputs.published != 'true'
        run: |
          nix run --no-update-lock-file path:.#integration-stage -- \
            "$IMAGE" "$GITHUB_RUN_ID" integration-digests
      - name: Upload integration digests
        if: needs.matrix.outputs.published != 'true'
        uses: *upload-artifact
        with:
          name: integrations-${{ matrix.system }}
          path: integration-digests/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  vulnerabilities:
    name: Go vulnerability checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - name: Check all Go modules
        run: nix run --no-update-lock-file path:.#dev-vuln

  acceptance:
    name: ${{ matrix.check }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.acceptance) }}
    env:
      NIX_ATTRS: ${{ toJSON(matrix.attrs) }}
    steps:
      - *checkout
      - *release-version
      - *nix
      - *nix-cache
      - *check

  kubernetes:
    name: Kubernetes acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.kubernetes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - name: Test Helm and Flux offline
        run: nix run --no-update-lock-file path:.#kubernetes-acceptance -- --output "$RUNNER_TEMP/kubernetes-evidence"
      - name: Upload Kubernetes evidence
        if: always()
        uses: *upload-artifact
        with:
          name: kubernetes-evidence
          path: ${{ runner.temp }}/kubernetes-evidence/
          if-no-files-found: warn
          retention-days: 7

  docs:
    name: docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, documentation, native, acceptance, vulnerabilities]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: docs
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs
      cancel-in-progress: false
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Publish release artifacts
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [matrix, quality, documentation, release-native, acceptance, vulnerabilities]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.matrix.outputs.image }}
      IMAGE_TAG: ${{ needs.matrix.outputs.image-tag }}
    steps:
      - *checkout
      - *release-version
      - *nix
      - *nix-cache
      - name: Read current release state
        id: state
        uses: *github-script
        with:
          script: |
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.GITHUB_REF_NAME }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('exists', Boolean(release));
            core.setOutput('published', Boolean(release && !release.draft));
      - name: Download release artifacts
        if: steps.state.outputs.published != 'true'
        uses: &download-artifact actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/
      - name: Collect checksums
        if: steps.state.outputs.published != 'true'
        run: nix run --no-update-lock-file path:.#release-checksums -- dist
      - name: Download container digests
        if: steps.state.outputs.published != 'true'
        uses: *download-artifact
        with:
          pattern: container-*
          merge-multiple: true
          path: container-digests/
      - name: Download integration digests
        if: steps.state.outputs.published != 'true'
        uses: *download-artifact
        with:
          pattern: integrations-*
          merge-multiple: true
          path: integration-digests/
      - name: Log in to GHCR
        uses: *registry-login
        with: *registry-credentials
      - name: Publish multi-platform index
        if: steps.state.outputs.published != 'true'
        id: container
        run: |
          amd64=$(cat container-digests/container-amd64.digest)
          arm64=$(cat container-digests/container-arm64.digest)
          digest=$(nix run --no-update-lock-file path:.#container-index -- "$IMAGE" "$IMAGE_TAG" "$amd64" "$arm64")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Publish integration artifacts
        if: steps.state.outputs.published != 'true'
        id: integrations
        run: |
          digest=$(nix run --no-update-lock-file path:.#integration-publish -- "$IMAGE" integration-digests/)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload release assets
        if: steps.state.outputs.published != 'true'
        uses: &github-release softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ needs.matrix.outputs.prerelease }}
          make_latest: 'false'
          generate_release_notes: ${{ steps.state.outputs.exists != 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/bale-linux-amd64.tar.gz
            dist/bale-linux-arm64.tar.gz
            dist/SHA256SUMS
      - name: Publish release
        if: steps.state.outputs.published != 'true'
        uses: *github-release
        with:
          draft: false
          prerelease: ${{ needs.matrix.outputs.prerelease }}
          make_latest: ${{ needs.matrix.outputs.prerelease != 'true' }}
      - name: Check latest release on rerun
        if: steps.state.outputs.published == 'true' && needs.matrix.outputs.prerelease != 'true'
        id: latest
        uses: *github-script
        with:
          retries: 3
          retry-exempt-status-codes: '400,401,403,422'
          script: |
            const { data: latest } = await github.rest.repos.getLatestRelease(context.repo);
            core.setOutput('current', latest.tag_name === process.env.GITHUB_REF_NAME);
      - name: Update latest container alias
        if: needs.matrix.outputs.prerelease != 'true' && steps.state.outputs.published != 'true'
        env:
          PUBLISHED_DIGEST: ${{ steps.container.outputs.digest }}
          PUBLISHED_FLUX_DIGEST: ${{ steps.integrations.outputs.digest }}
        run: |
          nix run --no-update-lock-file path:.#container-latest -- "$IMAGE" "$PUBLISHED_DIGEST"
          nix run --no-update-lock-file path:.#container-latest -- "$IMAGE-flux" "$PUBLISHED_FLUX_DIGEST"
      - name: Retry latest container alias
        if: needs.matrix.outputs.prerelease != 'true' && steps.state.outputs.published == 'true' && steps.latest.outputs.current == 'true'
        run: |
          nix run --no-update-lock-file path:.#container-latest -- "$IMAGE" "$IMAGE_TAG"
          nix run --no-update-lock-file path:.#container-latest -- "$IMAGE-flux" "$IMAGE_TAG"
