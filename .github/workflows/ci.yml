name: CI

on:
  push:
    branches: [main]
    # Native globs select unprefixed version-shaped tags, not strict SemVer.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+\+*'
      # Release tags do not use underscores.
      - '!**_*'
  pull_request:
  workflow_dispatch:
    inputs:
      kubernetes:
        description: Run the live Kubernetes acceptance suite (requires KVM)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Generate check matrices
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      quality: ${{ steps.matrix.outputs.quality }}
      docs: ${{ steps.matrix.outputs.docs }}
      native: ${{ steps.matrix.outputs.native }}
      published: ${{ steps.release.outputs.published }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      image: ${{ steps.release.outputs.image }}
      image-tag: ${{ steps.release.outputs.image-tag }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - &nix-cache
        name: Cache Nix builds
        uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
        continue-on-error: true
        with:
          version: v3.1.0
          upstream-cache-filter: true
      - id: matrix
        run: |
          matrices=$(nix eval --json --no-update-lock-file path:.#githubActions.matrices)
          for category in quality docs native; do
            printf '%s=%s\n' "$category" "$(jq -c --arg category "$category" '.[$category]' <<< "$matrices")" >> "$GITHUB_OUTPUT"
          done
      - name: Read release metadata
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: release
        uses: &github-script actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('published', Boolean(release && !release.draft));
            core.setOutput('prerelease', tag.split('+', 1)[0].includes('-'));
            core.setOutput('image', `ghcr.io/${context.repo.owner}/${context.repo.repo}`.toLowerCase());
            core.setOutput('image-tag', tag.replaceAll('+', '_'));

  quality:
    name: Quality checks
    needs: matrix
    runs-on: ${{ fromJSON(needs.matrix.outputs.quality).include[0].os }}
    timeout-minutes: 45
    env:
      NIX_ATTRS: ${{ toJSON(fromJSON(needs.matrix.outputs.quality).include[0].attrs) }}
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - &check
        name: Run checks
        run: |
          mapfile -t attrs < <(jq -r '.[] | "path:.#" + .' <<< "$NIX_ATTRS")
          nix build --no-link --no-update-lock-file --print-build-logs "${attrs[@]}"

  documentation:
    name: Documentation checks
    needs: matrix
    runs-on: ${{ fromJSON(needs.matrix.outputs.docs).include[0].os }}
    timeout-minutes: 30
    env:
      NIX_ATTRS: ${{ toJSON(fromJSON(needs.matrix.outputs.docs).include[0].attrs) }}
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - *check
      - name: Locate documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: site
        run: |
          site=$(nix path-info --no-update-lock-file path:.#checks.x86_64-linux.docs)
          printf 'path=%s\n' "$site" >> "$GITHUB_OUTPUT"
      - name: Upload documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.path }}

  native:
    name: Native checks
    if: github.event_name != 'push' || github.ref_type != 'tag'
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    env:
      NIX_ATTRS: ${{ toJSON(matrix.attrs) }}
    steps:
      - *checkout
      - &release-version
        name: Set release version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: printf '%s\n' "$GITHUB_REF_NAME" > nix/release-version
      - *nix
      - *nix-cache
      - *check
      - &container-smoke
        name: Run container without privileges
        run: |
          nix build --out-link result-container --no-update-lock-file path:.#container
          nix develop --no-update-lock-file path:.#release --command skopeo --insecure-policy copy \
            oci:result-container:nix "docker-archive:$RUNNER_TEMP/bale-container.tar:localhost/bale:nix"
          docker load --input "$RUNNER_TEMP/bale-container.tar"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            localhost/bale:nix --version
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            localhost/bale:nix --help
          nix build --out-link result-helm-plugin --no-update-lock-file path:.#helm-plugin
          fixture=$(mktemp -d "$RUNNER_TEMP/bale-fixture.XXXXXX")
          cp result-helm-plugin/lib/bale/plugins/helm.wasm "$fixture/helm.wasm"
          python3 -c 'import base64,json,pathlib,sys; print(json.dumps({"schemaVersion":1,"chart":base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode(),"release":"web","namespace":"apps"}))' \
            tests/integration/testdata/helm/podinfo-6.9.4.tgz > "$fixture/request.json"
          chmod 755 "$fixture"
          chmod 644 "$fixture/helm.wasm" "$fixture/request.json"
          for identity in default arbitrary; do
            workspace=$(mktemp -d "$RUNNER_TEMP/bale-work.XXXXXX")
            chmod 1777 "$workspace"
            user_args=()
            expected_owner=65532:65532
            if [ "$identity" = arbitrary ]; then
              expected_owner="$(id -u):$(id -g)"
              user_args=(--user "$expected_owner")
            fi
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
              "${user_args[@]}" --volume "$workspace:/work" \
              --volume "$fixture:/fixtures:ro" \
              localhost/bale:nix dependencies generate \
              --plugin-file /fixtures/helm.wasm --input /fixtures/request.json \
              --plugin-cache /work/cache > "$workspace/dependencies.yaml"
            test -s "$workspace/dependencies.yaml"
            grep -Fq 'ghcr.io/stefanprodan/podinfo:6.9.4' "$workspace/dependencies.yaml"
            test "$(sudo stat -c '%u:%g %a' "$workspace/cache")" = "$expected_owner 700"
            test -n "$(sudo find "$workspace/cache" -maxdepth 1 -type f -name '*.native' -size +0c -print -quit)"
          done

  release-native:
    name: Native release checks
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [matrix, quality, documentation, registry, vulnerabilities]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    env:
      NIX_ATTRS: ${{ toJSON(matrix.attrs) }}
      IMAGE: ${{ needs.matrix.outputs.image }}
      ARCH: ${{ matrix.system == 'x86_64-linux' && 'amd64' || 'arm64' }}
    steps:
      - *checkout
      - *release-version
      - *nix
      - *nix-cache
      - *check
      - *container-smoke
      - name: Locate release archive
        if: needs.matrix.outputs.published != 'true'
        run: nix build --out-link result-release --no-update-lock-file path:.#release-binary
      - name: Upload release artifacts
        if: needs.matrix.outputs.published != 'true'
        uses: &upload-artifact actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.system }}
          path: result-release/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Log in to GHCR
        if: needs.matrix.outputs.published != 'true'
        uses: &registry-login docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: &registry-credentials
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push native container
        if: needs.matrix.outputs.published != 'true'
        run: |
          nix build --out-link result-container --no-update-lock-file path:.#container
          nix develop --no-update-lock-file path:.#release --command skopeo copy \
            --format oci --digestfile "container-$ARCH.digest" \
            oci:result-container:nix "docker://$IMAGE:build-$GITHUB_RUN_ID-$ARCH"
      - name: Upload container digest
        if: needs.matrix.outputs.published != 'true'
        uses: *upload-artifact
        with:
          name: container-${{ matrix.system }}
          path: container-*.digest
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  vulnerabilities:
    name: Go vulnerability checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - name: Check all Go modules
        run: |
          nix develop --no-update-lock-file path:. --command bash -e <<'SCRIPT'
            for module in . plugins/helm plugins/helm-relocate; do
              (cd "$module" && govulncheck ./...)
            done
          SCRIPT

  registry:
    name: Registry acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *release-version
      - *nix
      - *nix-cache
      - name: Test Distribution and Zot
        run: nix run --no-update-lock-file path:.#registry-acceptance

  kubernetes:
    name: Kubernetes acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.kubernetes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout
      - *nix
      - *nix-cache
      - name: Require KVM
        run: |
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo 'Kubernetes acceptance requires readable and writable /dev/kvm.' >&2
            exit 1
          fi
      - name: Test Helm and Flux offline
        run: nix run --no-update-lock-file path:.#kubernetes-acceptance -- --output "$RUNNER_TEMP/kubernetes-evidence"
      - name: Upload Kubernetes evidence
        if: always()
        uses: *upload-artifact
        with:
          name: kubernetes-evidence
          path: ${{ runner.temp }}/kubernetes-evidence/
          if-no-files-found: warn
          retention-days: 7

  docs:
    name: docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, documentation, native, registry, vulnerabilities]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: docs
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: docs
      cancel-in-progress: false
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Publish binaries and containers
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [matrix, quality, documentation, release-native, registry, vulnerabilities]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.matrix.outputs.image }}
      IMAGE_TAG: ${{ needs.matrix.outputs.image-tag }}
    steps:
      - *checkout
      - *release-version
      - *nix
      - *nix-cache
      - name: Read current release state
        id: state
        uses: *github-script
        with:
          script: |
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.GITHUB_REF_NAME }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('exists', Boolean(release));
            core.setOutput('published', Boolean(release && !release.draft));
      - name: Download release artifacts
        if: steps.state.outputs.published != 'true'
        uses: &download-artifact actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/
      - name: Collect checksums
        if: steps.state.outputs.published != 'true'
        run: |
          test -f dist/bale-linux-amd64.tar.gz
          test -f dist/bale-linux-arm64.tar.gz
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Download container digests
        if: steps.state.outputs.published != 'true'
        uses: *download-artifact
        with:
          pattern: container-*
          merge-multiple: true
          path: container-digests/
      - name: Log in to GHCR
        uses: *registry-login
        with: *registry-credentials
      - name: Publish multi-platform index
        if: steps.state.outputs.published != 'true'
        id: container
        run: |
          amd64=$(cat container-digests/container-amd64.digest)
          arm64=$(cat container-digests/container-arm64.digest)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          digest=$(nix develop --no-update-lock-file path:.#release --command regctl index create "$IMAGE:$IMAGE_TAG" \
            --ref "$IMAGE@$amd64" --platform linux/amd64 \
            --ref "$IMAGE@$arm64" --platform linux/arm64 \
            --format '{{.Manifest.GetDescriptor.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload release assets
        if: steps.state.outputs.published != 'true'
        uses: &github-release softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ needs.matrix.outputs.prerelease }}
          make_latest: 'false'
          generate_release_notes: ${{ steps.state.outputs.exists != 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/bale-linux-amd64.tar.gz
            dist/bale-linux-arm64.tar.gz
            dist/SHA256SUMS
      - name: Publish release
        if: steps.state.outputs.published != 'true'
        uses: *github-release
        with:
          draft: false
          prerelease: ${{ needs.matrix.outputs.prerelease }}
          make_latest: ${{ needs.matrix.outputs.prerelease != 'true' }}
      - name: Check latest release on rerun
        if: steps.state.outputs.published == 'true' && needs.matrix.outputs.prerelease != 'true'
        id: latest
        uses: *github-script
        with:
          retries: 3
          retry-exempt-status-codes: '400,401,403,422'
          script: |
            const { data: latest } = await github.rest.repos.getLatestRelease(context.repo);
            core.setOutput('current', latest.tag_name === process.env.GITHUB_REF_NAME);
      - name: Update latest container alias
        if: needs.matrix.outputs.prerelease != 'true' && steps.state.outputs.published != 'true'
        env:
          PUBLISHED_DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          nix develop --no-update-lock-file path:.#release --command regctl image copy "$IMAGE@$PUBLISHED_DIGEST" "$IMAGE:latest"
      - name: Retry latest container alias
        if: needs.matrix.outputs.prerelease != 'true' && steps.state.outputs.published == 'true' && steps.latest.outputs.current == 'true'
        run: |
          digest=$(nix develop --no-update-lock-file path:.#release --command regctl image digest "$IMAGE:$IMAGE_TAG")
          nix develop --no-update-lock-file path:.#release --command regctl image copy "$IMAGE@$digest" "$IMAGE:latest"
